
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Management</title>

    <style>
        body {
            background: #111;
            color: white;
            font-family: Arial;
            margin: 20px;
        }

        header {
            text-align: center;
            background: #000;
            padding: 15px;
        }

        form, .card {
            background: #222;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #444;
        }

        input, textarea {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            background: #333;
            color: white;
            border: 1px solid #555;
        }

        button {
            background: #444;
            color: white;
            padding: 8px 12px;
            border: none;
            margin: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #666;
        }

        .recipes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }

        .card img {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
        }
    </style>
</head>

<body>

<header>
    <h1>Recipe Book</h1>
    <p>Add, View, Edit and Delete Recipes</p>
</header>

<h2 id="heading">Add Recipe</h2>

<form id="recipeForm">
    <input id="title" placeholder="Recipe Title" required>

    <textarea id="ingredients" placeholder="Ingredients" required></textarea>

    <textarea id="instructions" placeholder="Instructions" required></textarea>

    <input type="file" id="image" accept="image/*">

    <button type="submit" id="saveButton">Add Recipe</button>
    <button type="button" id="cancelButton" hidden>Cancel</button>
</form>

<input id="search" placeholder="Search Recipe">

<h2>My Recipes</h2>
<div id="recipes" class="recipes"></div>

<script>
    let recipes = JSON.parse(localStorage.getItem("recipes")) || [];
    let editId = null;
    let oldImage = "";

    // Save recipes
    function saveData() {
        localStorage.setItem("recipes", JSON.stringify(recipes));
    }

    // Display recipes
    function showRecipes() {
        let list = document.getElementById("recipes");
        let search = document.getElementById("search").value.toLowerCase();

        list.innerHTML = "";

        recipes.forEach(function(recipe) {
            if (
                recipe.title.toLowerCase().includes(search) ||
                recipe.ingredients.toLowerCase().includes(search)
            ) {
                let card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    ${recipe.image ? `<img src="${recipe.image}" alt="Recipe">` : ""}
                    <h3></h3>
                    <p></p>
                    <button onclick="viewRecipe('${recipe.id}')">View</button>
                    <button onclick="editRecipe('${recipe.id}')">Edit</button>
                    <button onclick="deleteRecipe('${recipe.id}')">Delete</button>
                `;

                card.querySelector("h3").textContent = recipe.title;
                card.querySelector("p").textContent = recipe.ingredients;

                list.appendChild(card);
            }
        });
    }

    // Add or update recipe
    document.getElementById("recipeForm").onsubmit = function(event) {
        event.preventDefault();

        let title = document.getElementById("title").value.trim();
        let ingredients = document.getElementById("ingredients").value.trim();
        let instructions = document.getElementById("instructions").value.trim();
        let file = document.getElementById("image").files[0];

        if (!title || !ingredients || !instructions) {
            alert("Please fill all required fields");
            return;
        }

        if (file && (!file.type.startsWith("image/") || file.size > 1024 * 1024)) {
            alert("Choose an image under 1 MB");
            return;
        }

        function saveRecipe(image) {
            let recipe = {
                id: editId || Date.now().toString(),
                title: title,
                ingredients: ingredients,
                instructions: instructions,
                image: image
            };

            if (editId) {
                recipes = recipes.map(function(item) {
                    return item.id === editId ? recipe : item;
                });
            } else {
                recipes.push(recipe);
            }

            try {
                saveData();
            } catch (error) {
                alert("Storage is full. Try a smaller image.");
                return;
            }

            document.getElementById("recipeForm").reset();
            editId = null;
            oldImage = "";

            document.getElementById("heading").textContent = "Add Recipe";
            document.getElementById("saveButton").textContent = "Add Recipe";
            document.getElementById("cancelButton").hidden = true;

            showRecipes();
        }

        if (file) {
            let reader = new FileReader();

            reader.onload = function() {
                saveRecipe(reader.result);
            };

            reader.readAsDataURL(file);
        } else {
            saveRecipe(oldImage);
        }
    };

    // View recipe
    function viewRecipe(id) {
        let recipe = recipes.find(function(item) {
            return item.id === id;
        });

        if (recipe) {
            alert(
                "Title: " + recipe.title +
                "\n\nIngredients:\n" + recipe.ingredients +
                "\n\nInstructions:\n" + recipe.instructions
            );
        }
    }

    // Edit recipe
    function editRecipe(id) {
        let recipe = recipes.find(function(item) {
            return item.id === id;
        });

        if (recipe) {
            editId = id;
            oldImage = recipe.image || "";

            document.getElementById("title").value = recipe.title;
            document.getElementById("ingredients").value = recipe.ingredients;
            document.getElementById("instructions").value = recipe.instructions;

            document.getElementById("heading").textContent = "Edit Recipe";
            document.getElementById("saveButton").textContent = "Update Recipe";
            document.getElementById("cancelButton").hidden = false;

            window.scrollTo(0, 0);
        }
    }

    // Delete recipe
    function deleteRecipe(id) {
        if (confirm("Do you want to delete this recipe?")) {
            recipes = recipes.filter(function(item) {
                return item.id !== id;
            });

            saveData();
            showRecipes();
        }
    }

    // Cancel editing
    document.getElementById("cancelButton").onclick = function() {
        editId = null;
        oldImage = "";

        document.getElementById("recipeForm").reset();
        document.getElementById("heading").textContent = "Add Recipe";
        document.getElementById("saveButton").textContent = "Add Recipe";
        this.hidden = true;
    };

    // Search recipes
    document.getElementById("search").oninput = showRecipes;

    showRecipes();
</script>

</body>
</html>
